# Prüft jede Änderung und veröffentlicht nur, was auf main landet.
# Analog zur Essens-Check-App wird GitHub Pages als Ziel verwendet.
name: Prüfen und veröffentlichen

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

env:
  VEROEFFENTLICHEN: ${{ github.event_name == 'push' && github.ref == 'refs/heads/main' }}

jobs:
  pruefen:
    name: Prüfen
    runs-on: ubuntu-latest
    permissions:
      contents: read
      pages: write
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4

      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4
        with:
          node-version: 22

      - run: npm install

      - name: Genealogische Daten prüfen
        run: npm run validate:data

      - name: UX-Regressions prüfen
        run: npm run validate:ux

      - name: Bauen
        run: npm run build

      - name: Pages vorbereiten
        if: env.VEROEFFENTLICHEN == 'true'
        uses: actions/configure-pages@983d7736d9b0ae728b81ab479565c72886d7745b # v5

      - name: Artefakt hochladen
        if: env.VEROEFFENTLICHEN == 'true'
        uses: actions/upload-pages-artifact@56afc609e74202658d3ffba0e8f6dda462b719fa # v3
        with:
          path: dist

  veroeffentlichen:
    name: Veröffentlichen
    needs: pruefen
    if: github.event_name == 'push' && github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    permissions:
      pages: write
      id-token: write
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@d6db90164ac5ed86f2b6aed7e0febac5b3c0c03e # v4
