name: CI

on:
  pull_request:
  push:
    branches: [main]

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - run: npm install
      - run: npm run validate:data
      - run: npm run build

      - name: Build private deployment container
        run: docker build -t stammbaum-villiger:ci .

      - name: Smoke-Test für serverseitigen Zugriffsschutz
        shell: bash
        run: |
          set -euo pipefail
          container=stammbaum-ci
          password_file="$(mktemp)"
          cleanup() {
            docker rm -f "$container" >/dev/null 2>&1 || true
            rm -f "$password_file"
          }
          trap cleanup EXIT

          printf '%s' 'ci-only-test-password' > "$password_file"
          chmod 600 "$password_file"

          docker run -d \
            --name "$container" \
            -p 18080:8080 \
            -e STAMMBAUM_USER=ci-test \
            -e STAMMBAUM_PASSWORD_FILE=/run/secrets/stammbaum-password \
            -v "$password_file:/run/secrets/stammbaum-password:ro" \
            stammbaum-villiger:ci

          for attempt in $(seq 1 20); do
            code="$(curl -sS -o /dev/null -w '%{http_code}' http://127.0.0.1:18080/ || true)"
            if [ "$code" = "401" ]; then
              break
            fi
            sleep 1
          done

          test "$code" = "401"
          test "$(curl -sS -u 'ci-test:ci-only-test-password' -o /dev/null -w '%{http_code}' http://127.0.0.1:18080/)" = "200"
          test "$(curl -sS -u 'ci-test:ci-only-test-password' -o /dev/null -w '%{http_code}' http://127.0.0.1:18080/sw.js)" = "200"
